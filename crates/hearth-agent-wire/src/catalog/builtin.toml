# Curated ACP catalog. Profiles resolve to LaunchSpec data.
# Rows share AcpCodec on jsonl-rpc (newline-delimited JSON-RPC).
# Not Content-Length. Pi rpc_chunk reassembly is not used. No process spawn.
# Attach is HostAttach::resume (native_resume_id), not Gemini session/load.
# caps_override stays off the file: fast-mode / extMethod toggles are Host
# (SetFeature), not a CursorCodec or CopilotCodec fork. The claude-acp
# subagent cap is applied in Rust (CapabilityFlags::CLAUDE_ACP) so the
# generic ACP row stays subagent: false.

[[profile]]
id = "copilot"
label = "GitHub Copilot"
command = ["copilot", "--acp"]
extends = "acp"

[[profile]]
id = "cursor"
label = "Cursor"
command = ["cursor-agent", "acp"]
extends = "acp"

[[profile]]
id = "claude-acp"
label = "Claude Code (ACP)"
command = ["claude-agent-acp"]
extends = "acp"
