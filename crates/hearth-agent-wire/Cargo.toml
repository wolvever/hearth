[package]
name = "hearth-agent-wire"
version = "0.1.0"
edition = "2021"
description = "Unified coding-agent wire for Hearth (Grok Build / Codex / Pi / OpenCode)"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "hearth-agent-wire"
path = "src/main.rs"

[dependencies]
hearth = { path = "../hearth" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
