[package]
name = "hearth-service"
version = "0.1.0"
edition = "2021"
description = "Local HTTP surface for hearth sessions"
license = "MIT"

[dependencies]
hearth = { path = "../hearth" }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time", "sync", "io-util"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4", "serde"] }

[[bin]]
name = "hearth-service"
path = "src/main.rs"

[dev-dependencies]
tokio-tungstenite = "0.26"
futures-util = "0.3"
